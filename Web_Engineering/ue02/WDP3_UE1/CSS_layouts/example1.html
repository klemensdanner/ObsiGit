<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .c1 {
            /*margin: 25px;*/
            border: 5px solid black;
            padding: 10px;
            width: 400px;
            height: 200px;
            background-color: aquamarine;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .border-box {  /* borderbox nimmt die Breite und Höhe komplett an - incl. aller margins und paddings etc.. contentbox exclusive */
            box-sizing: border-box;
        }

        .block {
            /* display: none; /* platz ist freigegeben
            display: hidden; platz ist noch blockiert, nur Sichtbarkeit wird verhindert */
            display: block; /* macht aus einem inline element ein blockelement */
        }

        .inline {
            display: inline;
        }

        .inline-block {
            display: inline-block;
        }


        .relative {
            position: relative;
            top: 50px;
            left: 50px;
        }

        .absolute {
            position: absolute;
            top: 50px;
            left: 50px
        }


        #container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

    </style>

</head>
