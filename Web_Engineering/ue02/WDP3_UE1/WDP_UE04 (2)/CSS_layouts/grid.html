<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 100px 200px 100px;
            grid-auto-rows: 100px;
            gap: 10px;

            grid-template-areas:
                "header header header"
                "sidebar content content"
                "sidebar content content"
                "footer footer footer"    
            ;
        }

        .item-1 {grid-area: header}
        .item-2 {grid-area: sidebar}
        .item-3 {grid-area: content}
        .item-4 {grid-area: footer}


        .item {
            background-color: green;
            border: 1px solid blueviolet;
        }

        .item-7 {
            grid-column: 1 / 3; /* über mehrere spalten / zeilen */
        }


    </style>

</head>
<body>

    <div class="container">
        <div class="item item-1">Header</div>
        <div class="item item-2">Two</div>
        <div class="item item-3">Three</div>
        <div class="item item-4">Four</div>
<!--         <div class="item item-5">Five</div>
        <div class="item item-6">Six</div>
        <div class="item item-7">Seven</div>
        <div class="item item-8">Eight</div>
        <div class="item item-9">Nine</div>
        <div class="item item-10">Ten</div> -->
    </div>
    
</body>
</html>
